# Checkpoint 2 experiment configuration.
# This file defines the small real-data pilot used to validate the evaluation + repair pipeline.

checkpoint:
  name: checkpoint2

prompt_subset:
  source_prompts: ../data/prompts/prompts.csv
  source_constraints: ../data/prompts/constraints.csv
  out_prompts: ../data/prompts/prompts_checkpoint2.csv
  out_constraints: ../data/prompts/constraints_checkpoint2.csv
  selection_mode: explicit_prompt_ids
  prompt_ids:
    # Spatial single-constraint prompts
    - spatial_natural_single_001
    - spatial_natural_single_003
    - spatial_natural_single_006
    - spatial_natural_single_009
    - spatial_natural_single_012
    - spatial_natural_single_015
    - spatial_simple_single_019
    - spatial_simple_single_022
    - spatial_simple_single_025
    - spatial_simple_single_028

    # Attribute single-constraint prompts
    - attribute_natural_single_006
    - attribute_natural_single_012
    - attribute_natural_single_018
    - attribute_simple_single_024
    - attribute_simple_single_030

    # Cardinality single-constraint prompts
    - cardinality_natural_single_001
    - cardinality_natural_single_011
    - cardinality_natural_single_021
    - cardinality_simple_single_026
    - cardinality_simple_single_030

generation:
  provider: openai
  model_name: gpt-image-1
  image_dir: ../data/images/openai_checkpoint2
  generations_csv: ../data/generations/generations_checkpoint2.csv
  samples_per_prompt: 1
  size: 1024x1024
  quality: low

human_labels:
  labels_csv: ../data/labels/human_labels_checkpoint2.csv

vlm_checker:
  provider: openai
  model_name: gpt-4.1
  labels_csv: ../data/labels/vlm_labels_checkpoint2.csv
  use_structured_output: false

analysis:
  out_dir: ../results/checkpoint2

repair:
  # Code supports both repair_all_failed and repair_single_target.
  # Checkpoint 2 default: repair all failed constraints in each failed image.
  strategies:
    - repair_all_failed
    # - repair_single_target
  trigger_label_source: human
  trigger_labels:
    - fail
  max_repairs: 10

  repaired_prompts_csv: ../data/repaired/repaired_prompts_checkpoint2.csv
  repair_targets_csv: ../data/repaired/repair_targets_checkpoint2.csv

  repaired_image_dir: ../data/repaired/images_checkpoint2
  repaired_generations_csv: ../data/repaired/repaired_generations_checkpoint2.csv
  repaired_human_labels_csv: ../data/repaired/repaired_human_labels_checkpoint2.csv
  repaired_vlm_labels_csv: ../data/repaired/repaired_vlm_labels_checkpoint2.csv

  repair_target_results_csv: ../results/checkpoint2/repair_target_results.csv
  repair_image_results_csv: ../results/checkpoint2/repair_image_results.csv
  repair_success_by_type_csv: ../results/checkpoint2/repair_success_by_constraint_type.csv
  repair_summary_metrics_csv: ../results/checkpoint2/repair_summary_metrics.csv
