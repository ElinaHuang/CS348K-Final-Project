# Checkpoint 2 experiment configuration.
# This file defines the small real-data pilot used to validate the evaluation + repair pipeline.

checkpoint:
  name: checkpoint2

prompt_subset:
  source_prompts: ../data/prompts/prompts.csv
  source_constraints: ../data/prompts/constraints.csv
  out_prompts: ../data/prompts/prompts_checkpoint2.csv
  out_constraints: ../data/prompts/constraints_checkpoint2.csv
  selection_mode: explicit_prompt_ids
  prompt_ids:
    # Spatial single-constraint prompts
    - spatial_natural_single_001
    - spatial_natural_single_003
    - spatial_natural_single_006
    - spatial_natural_single_009
    - spatial_natural_single_012
    - spatial_natural_single_015
    - spatial_simple_single_019
    - spatial_simple_single_022
    - spatial_simple_single_025
    - spatial_simple_single_028

    # Attribute single-constraint prompts
    - attribute_natural_single_006
    - attribute_natural_single_012
    - attribute_natural_single_018
    - attribute_simple_single_024
    - attribute_simple_single_030

    # Cardinality single-constraint prompts
    - cardinality_natural_single_001
    - cardinality_natural_single_011
    - cardinality_natural_single_021
    - cardinality_simple_single_026
    - cardinality_simple_single_030

    # Combined attribute + spatial prompts
    - combo_attr_spatial_natural_001
    - combo_attr_spatial_natural_011
    - combo_attr_spatial_natural_021
    - combo_attr_spatial_simple_026
    - combo_attr_spatial_simple_030

    # Combined cardinality + spatial prompts
    - combo_card_spatial_natural_005
    - combo_card_spatial_natural_010
    - combo_card_spatial_natural_015
    - combo_card_spatial_simple_025
    - combo_card_spatial_simple_030
