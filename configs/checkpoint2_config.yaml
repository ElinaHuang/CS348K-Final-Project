# Checkpoint 2 experiment configuration.
# This file defines the small real-data pilot used to validate the evaluation + repair pipeline.

checkpoint:
  name: checkpoint2

prompt_subset:
  source_prompts: ../data/prompts/prompts.csv
  source_constraints: ../data/prompts/constraints.csv
  out_prompts: ../data/prompts/prompts_checkpoint2.csv
  out_constraints: ../data/prompts/constraints_checkpoint2.csv
  selection_mode: explicit_prompt_ids
  prompt_ids:
    # Spatial single-constraint prompts
    - spatial_simple_single_001
    - spatial_natural_single_002
    - spatial_simple_single_003
    - spatial_natural_single_004
    - spatial_simple_single_005
    - spatial_natural_single_006
    - spatial_simple_single_007
    - spatial_natural_single_008
    - spatial_simple_single_009
    - spatial_natural_single_010

    # Combined attribute + spatial prompts
    - combo_attr_spatial_simple_001
    - combo_attr_spatial_natural_002
    - combo_attr_spatial_simple_003
    - combo_attr_spatial_natural_004
    - combo_attr_spatial_simple_005

    # Combined cardinality + spatial prompts
    - combo_card_spatial_simple_001
    - combo_card_spatial_natural_002
    - combo_card_spatial_simple_003
    - combo_card_spatial_natural_004
    - combo_card_spatial_simple_005
